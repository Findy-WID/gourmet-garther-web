# ─────────────────────────────────────────────────────────────
# Gourmet Gather admin panel (Sveltia CMS)
#
# Edits are saved as commits to the GitHub repo below; Vercel
# rebuilds the site about a minute later.
# ─────────────────────────────────────────────────────────────
backend:
  name: github
  repo: Findy-WID/gourmet-garther-web
  branch: main
  commit_messages:
    create: 'Admin: add {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'

logo:
  src: /brand/icon-512.png

# Uploaded photos are saved to public/images/menu and shown on the site as /images/menu/…
media_folder: public/images/menu
public_folder: /images/menu

# Photos are shrunk and converted to WebP in the browser as they're uploaded,
# so the owner can upload straight from his phone (JPG, PNG or iPhone HEIC).
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1000
          height: 1000

collections:
  # ── Dishes ────────────────────────────────────────────────
  - name: dishes
    label: Dishes
    label_singular: Dish
    description: Every dish on the website. Tap a dish to change its name, price, photo or what’s included. To add a dish, click New Dish — the Order button appears on the website by itself.
    folder: content/dishes
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} — ₦{{price}}'
    sortable_fields: [name, price, section, sort]
    view_groups:
      - { label: Menu section, field: section }
    view_filters:
      - { label: Sold out, field: available, pattern: false }
      - { label: Most ordered, field: popular, pattern: true }
    fields:
      - { label: Dish name, name: name, widget: string }
      - label: Photo
        name: image
        widget: image
        required: false
        hint: Upload straight from your phone — it's resized automatically. Leave empty to show the drawn placeholder.
      - label: Price (₦)
        name: price
        widget: number
        value_type: int
        min: 0
        required: false
        hint: Numbers only, e.g. 6500. This is the starting price, before any proteins the customer adds. Leave empty to show “Price coming soon”.
      - label: Size or serving
        name: unit
        widget: string
        required: false
        hint: Short line under the name, e.g. “1 plate”, “2 litres”, “Serves 4 to 6”.
      - label: Menu
        name: section
        widget: select
        options:
          - { label: Plates, value: plates }
          - { label: Bowls & bulk, value: buckets }
          - { label: Workplace, value: corporate }
      - label: Category
        name: category
        widget: select
        options:
          - Rice
          - Soups
          - Pasta
          - Pepper soups
          - Sauces & stews
          - Porridge
          - Sides & combos
          - Special dishes
          - Stew & Ekpang
          - Bulk combos
          - Lunch packs
          - Meetings & events
        hint: 'The heading it sits under on the menu. Plates use Rice, Soups, Pasta, Pepper soups, Sauces & stews, Porridge, Sides & combos, Special dishes. Bowls & bulk use Soups, Rice, Stew & Ekpang, Bulk combos. Workplace uses Lunch packs, Meetings & events.'
      - { label: Description, name: description, widget: text, required: false, hint: Optional. One or two sentences shown on the dish page. }
      - label: What’s included
        name: includes
        widget: list
        required: false
        field: { label: Item, name: item, widget: string }
        hint: Shown in the “What’s included” dropdown on the dish page. Add one item per line, including any base proteins cooked into it, e.g. Afang Soup → Stockfish, Periwinkle. Leave empty to hide the dropdown.
      - label: Note under “What’s included”
        name: proteinNote
        widget: string
        required: false
        hint: Optional, e.g. “Proteins aren’t included. Add the ones you want below.”
      - label: Proteins & add-ons customers can add
        name: extrasGroup
        widget: relation
        collection: options
        file: groups
        required: false
        value_field: '{{extras.*.id}}'
        display_fields: ['{{extras.*.name}}']
        search_fields: ['{{extras.*.name}}']
        hint: 'Usually “Add protein” for plates, “Soups: extra protein & swallow” for soups, “Bowls: proteins & swallow” for bowls. Prices are edited under Proteins & options.'
      - label: Questions the customer must answer
        name: choiceGroups
        widget: relation
        collection: options
        file: groups
        multiple: true
        required: false
        value_field: '{{choices.*.id}}'
        display_fields: ['{{choices.*.name}}']
        search_fields: ['{{choices.*.name}}']
        hint: 'Optional. E.g. “Swallow: Garri or Fufu” makes the customer pick their swallow.'
      - label: Available to order
        name: available
        widget: boolean
        default: true
        hint: Switch off to show “Sold out” without deleting the dish.
      - label: Only cooked on certain days
        name: days
        widget: select
        multiple: true
        required: false
        options:
          - { label: Monday, value: monday }
          - { label: Tuesday, value: tuesday }
          - { label: Wednesday, value: wednesday }
          - { label: Thursday, value: thursday }
          - { label: Friday, value: friday }
          - { label: Saturday, value: saturday }
          - { label: Sunday, value: sunday }
        hint: Leave empty if it’s available every day.
      - label: Feature on the home page
        name: popular
        widget: boolean
        default: false
        required: false
        hint: Shows the dish under “Start with these” on the home page.
      - label: Minimum order
        name: minQty
        widget: number
        value_type: int
        default: 1
        min: 1
        hint: Leave at 1. Workplace packs use a higher number, e.g. 10.
      - label: Show a “Sample” badge
        name: placeholder
        widget: boolean
        default: false
        required: false
        hint: Switch off once the dish has its real name, price and photo.
      - { name: sort, widget: hidden, default: 500 }

  # ── Shared choices and extras ─────────────────────────────
  - name: options
    label: Proteins & options
    description: 'What customers pick when they order. To add, remove or reprice a protein, open “Add-ons with prices” → “Add protein” (plates), “Soups: extra protein & swallow” and “Bowls: proteins & swallow”. A price changed here changes on every dish that uses that list.'
    files:
      - name: groups
        label: Proteins & options
        file: content/option-groups.json
        format: json
        fields:
          - label: Pick-one questions (e.g. which swallow, which soup)
            name: choices
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            fields:
              - label: Name (admin only)
                name: name
                widget: string
                hint: How you’ll find this group when linking it to a dish, e.g. “Plates — protein”.
              - { name: id, widget: hidden }
              - label: Question shown to customers
                name: label
                widget: string
                hint: e.g. “Choose your protein”
              - label: Options
                name: options
                widget: list
                summary: '{{fields.label}} ({{fields.price}})'
                hint: The first option is selected by default.
                fields:
                  - { label: Option, name: label, widget: string }
                  - label: Price change (₦)
                    name: price
                    widget: number
                    value_type: int
                    default: 0
                    hint: Added to the dish price. 0 = no change. Use a minus number for cheaper, e.g. -500
          - label: Add-ons with prices (e.g. proteins)
            name: extras
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            fields:
              - label: Name (admin only)
                name: name
                widget: string
              - { name: id, widget: hidden }
              - label: Most pieces allowed in total
                name: max
                widget: number
                value_type: int
                default: 0
                required: false
                hint: 0 = no limit
              - label: Items
                name: items
                widget: list
                summary: '{{fields.label}} (₦{{fields.price}})'
                fields:
                  - { label: Item, name: label, widget: string }
                  - { label: Price (₦), name: price, widget: number, value_type: int, min: 0 }
                  - label: Note
                    name: note
                    widget: string
                    required: false
                    hint: Optional, e.g. “per piece”

  # ── Pages ─────────────────────────────────────────────────
  - name: pages
    label: Careers
    description: Job openings. Switch a role to Closed, add a new one, or delete it.
    files:
      - name: careers
        label: Careers
        file: content/careers.json
        format: json
        fields:
          - { label: Intro, name: intro, widget: text }
          - { label: Application email, name: applyEmail, widget: string }
          - { label: Application WhatsApp (digits, with 234), name: applyWhatsapp, widget: string }
          - { label: WhatsApp number as shown, name: applyWhatsappDisplay, widget: string }
          - { label: How to apply, name: howToApply, widget: text }
          - { label: General requirements, name: generalRequirements, widget: list, required: false, field: { label: Requirement, name: item, widget: string } }
          - { label: Closing note (optional), name: openToAll, widget: text, required: false, hint: 'Small line under How to apply. Leave empty to hide it.' }
          - label: Open positions
            name: positions
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Job title, name: title, widget: string }
              - { label: Location, name: location, widget: string, default: Uyo }
              - { label: Type (e.g. Full-time), name: type, widget: string, required: false }
              - { label: Note (e.g. Female applicants), name: note, widget: string, required: false }
              - { label: Open, name: open, widget: boolean, default: true, hint: 'On = shows as Open with apply buttons. Off = shows as Closed. Delete the role to remove it completely.' }
              - { label: Job description, name: summary, widget: text, required: false, hint: 'Write it like a normal message. Leave an empty line between paragraphs.' }
              - { label: Requirements, name: requirements, widget: list, required: false, field: { label: Requirement, name: item, widget: string } }
              - { label: Work schedule, name: schedule, widget: string, required: false }
              - { label: Job description link (Google Doc), name: jdLink, widget: string, required: false }

  # ── Customer reviews ──────────────────────────────────────
  - name: reviews
    label: Reviews
    description: Real customer messages shown on the home page under “What our customers say”. Never add a customer’s name or number.
    files:
      - name: reviews
        label: Reviews
        file: content/testimonials.json
        format: json
        fields:
          - { label: Section title, name: title, widget: string }
          - { label: Line under the title, name: intro, widget: string, required: false }
          - label: Reviews
            name: items
            widget: list
            summary: '{{fields.quote}}'
            hint: The first 6 show straight away; the rest appear when a visitor taps “Read all reviews”. Drag to reorder.
            fields:
              - { label: What the customer said, name: quote, widget: text, hint: Copy it as they wrote it. Leave out names and phone numbers. }
              - { label: Dish (optional), name: dish, widget: string, required: false, hint: e.g. Afang Soup }
              - label: Where it came from (optional)
                name: source
                widget: select
                required: false
                options: [WhatsApp, Facebook, Instagram, Messenger, TikTok, Google]

  # ── Legal pages ───────────────────────────────────────────
  - name: legal
    label: Legal pages
    description: Privacy Policy, Refund Policy and Terms of Service. Linked in the footer and at checkout.
    files:
      - name: legal
        label: Legal pages
        file: content/legal.json
        format: json
        fields:
          - { label: Last updated, name: updated, widget: string, hint: 'Change this whenever you edit a policy, e.g. 9 November 2026.' }
          - label: Pages
            name: pages
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: '{{fields.title}}'
            fields:
              - { name: slug, widget: hidden }
              - { label: Title, name: title, widget: string }
              - { label: Short name (tab), name: short, widget: string }
              - label: Text
                name: body
                widget: text
                hint: 'Leave an empty line between paragraphs. Start a line with “## ” for a heading and “- ” for a bullet point. Wrap words in **double stars** to make them bold.'

  # ── Restaurant settings ───────────────────────────────────
  - name: settings
    label: Restaurant settings
    description: Opening hours, WhatsApp, email, address, social links and the first-order discount.
    files:
      - name: settings
        label: Restaurant settings
        file: content/settings.json
        format: json
        fields:
          - label: WhatsApp number for orders
            name: whatsapp
            widget: string
            pattern: ['^[0-9]{10,15}$', 'Digits only, starting with the country code, e.g. 2349034013321']
            hint: Digits only, with country code and no +, e.g. 2349034013321
          - label: WhatsApp number as shown on the site
            name: whatsappDisplay
            widget: string
            hint: e.g. +234 903 401 3321
          - { label: Tagline, name: tagline, widget: string, default: Where Taste Meets Tradition }
          - { label: Short intro (home page), name: intro, widget: text }
          - { label: City, name: city, widget: string, default: Uyo }
          - { label: Address, name: address, widget: text, hint: Shown in the footer, on the About page and for pickup orders. }
          - { label: Email, name: email, widget: string, required: false }
          - label: Social media links
            name: socials
            widget: object
            fields:
              - { label: Instagram link, name: instagram, widget: string, required: false }
              - { label: TikTok link, name: tiktok, widget: string, required: false }
              - { label: Facebook link, name: facebook, widget: string, required: false }
          - label: First-order discount
            name: promo
            widget: object
            fields:
              - { label: Show the offer, name: enabled, widget: boolean, default: true }
              - { label: Code, name: code, widget: string, hint: 'Customers type this at checkout, e.g. GOURMET' }
              - { label: Discount (%), name: percent, widget: number, value_type: int, min: 1, max: 100 }
              - { label: Banner text, name: banner, widget: string, hint: The code is added after this text automatically. }
          - label: Opening hours (Nigeria time)
            name: hours
            widget: object
            hint: 24-hour clock. 9 = 9am, 13 = 1pm, 21 = 9pm. Visitors see “We’re closed” outside these hours and can still pre-order.
            fields:
              - label: Monday
                name: monday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Tuesday
                name: tuesday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Wednesday
                name: wednesday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Thursday
                name: thursday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Friday
                name: friday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Saturday
                name: saturday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Sunday
                name: sunday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
