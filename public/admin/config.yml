# ─────────────────────────────────────────────────────────────
# Gourmet Gather admin panel (Sveltia CMS)
#
# ONE THING TO SET: replace the repo below with your GitHub
# username and repository name, e.g.  findy/gourmet-gather-web
# ─────────────────────────────────────────────────────────────
backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/gourmet-gather-web
  branch: main
  commit_messages:
    create: 'Admin: add {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'

logo:
  src: /brand/icon-512.png

# Uploaded photos are saved to public/images and shown on the site as /images/…
media_folder: public/images
public_folder: /images

collections:
  # ── Dishes ────────────────────────────────────────────────
  - name: dishes
    label: Dishes
    label_singular: Dish
    description: Every meal on the menu. Change names, prices and photos here, or mark a dish as sold out.
    folder: content/dishes
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} — ₦{{price}}'
    sortable_fields: [name, price, section, sort]
    view_groups:
      - { label: Menu section, field: section }
    view_filters:
      - { label: Sold out, field: available, pattern: false }
      - { label: Most ordered, field: popular, pattern: true }
    fields:
      - { label: Dish name, name: name, widget: string }
      - label: Photo
        name: image
        widget: image
        required: false
        hint: A square or landscape photo works best. Leave empty to show the drawn placeholder.
      - label: Price (₦)
        name: price
        widget: number
        value_type: int
        min: 0
        hint: Starting price in Naira, before choices and extras. Numbers only, e.g. 6500
      - label: Menu section
        name: section
        widget: select
        options:
          - { label: Plates, value: plates }
          - { label: Buckets, value: buckets }
          - { label: Workplace / corporate, value: corporate }
      - label: Category
        name: category
        widget: string
        hint: The filter it appears under on the menu page, e.g. Rice, Soups, Lunch packs. Use the same spelling for dishes in the same category.
      - label: Serving info
        name: unit
        widget: string
        required: false
        hint: Short line under the name, e.g. “1 plate” or “Serves 4 to 6”
      - { label: Description, name: description, widget: text, required: false }
      - label: Available to order
        name: available
        widget: boolean
        default: true
        hint: Switch off to show the dish as “Sold out” without deleting it.
      - label: Only cooked on certain days
        name: days
        widget: select
        multiple: true
        required: false
        options: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        hint: Leave empty if it’s available every day. e.g. Mushroom Soup → friday
      - label: Sample dish (not on the real menu yet)
        name: placeholder
        widget: boolean
        default: false
        required: false
      - label: Show in “Start with these” on the home page
        name: popular
        widget: boolean
        default: false
        required: false
      - label: Minimum quantity
        name: minQty
        widget: number
        value_type: int
        default: 1
        min: 1
        hint: For workplace packs, e.g. 10
      - label: Order on the menu
        name: sort
        widget: number
        value_type: int
        default: 500
        hint: Lower numbers show first.
      - label: Choices (customer picks one from each)
        name: choiceGroups
        widget: relation
        collection: options
        file: groups
        multiple: true
        required: false
        value_field: '{{choices.*.id}}'
        display_fields: ['{{choices.*.name}}']
        search_fields: ['{{choices.*.name}}']
        hint: e.g. “Plates — protein”. Edit the options and their prices under “Choices & extras”.
      - label: Extras (optional add-ons)
        name: extrasGroup
        widget: relation
        collection: options
        file: groups
        required: false
        value_field: '{{extras.*.id}}'
        display_fields: ['{{extras.*.name}}']
        search_fields: ['{{extras.*.name}}']

  # ── Shared choices and extras ─────────────────────────────
  - name: options
    label: Choices & extras
    description: Protein choices, sizes, sides and add-ons shared between dishes. Changing a price here updates every dish that uses it.
    files:
      - name: groups
        label: Choices & extras
        file: content/option-groups.json
        format: json
        fields:
          - label: Choices (customer picks one)
            name: choices
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            fields:
              - label: Name (admin only)
                name: name
                widget: string
                hint: How you’ll find this group when linking it to a dish, e.g. “Plates — protein”.
              - label: Code
                name: id
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only']
                hint: A short code, e.g. plate-protein. Don’t change it once dishes use it.
              - label: Question shown to customers
                name: label
                widget: string
                hint: e.g. “Choose your protein”
              - label: Options
                name: options
                widget: list
                summary: '{{fields.label}} ({{fields.price}})'
                hint: The first option is selected by default.
                fields:
                  - { label: Option, name: label, widget: string }
                  - label: Price change (₦)
                    name: price
                    widget: number
                    value_type: int
                    default: 0
                    hint: Added to the dish price. 0 = no change. Use a minus number for cheaper, e.g. -500
          - label: Extras (customer adds any quantity)
            name: extras
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            fields:
              - label: Name (admin only)
                name: name
                widget: string
              - label: Code
                name: id
                widget: string
                pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and dashes only']
                hint: A short code, e.g. plate-extras. Don’t change it once dishes use it.
              - label: Most pieces allowed in total
                name: max
                widget: number
                value_type: int
                default: 0
                required: false
                hint: 0 = no limit
              - label: Items
                name: items
                widget: list
                summary: '{{fields.label}} (₦{{fields.price}})'
                fields:
                  - { label: Item, name: label, widget: string }
                  - { label: Price (₦), name: price, widget: number, value_type: int, min: 0 }
                  - label: Note
                    name: note
                    widget: string
                    required: false
                    hint: Optional, e.g. “per piece”

  # ── Pages ─────────────────────────────────────────────────
  - name: pages
    label: Pages
    description: About page and careers (job openings).
    files:
      - name: about
        label: About page
        file: content/about.json
        format: json
        fields:
          - { label: Still draft text, name: placeholder, widget: boolean, default: false, required: false }
          - { label: Title, name: title, widget: string }
          - { label: Opening line, name: intro, widget: text }
          - { label: Top photo, name: image, widget: image, required: false }
          - label: How we started
            name: story
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: text, widget: text } }
              - label: Opening date
                name: milestone
                widget: object
                fields:
                  - { label: Date, name: date, widget: string }
                  - { label: Text, name: text, widget: string }
          - label: What we cook
            name: cook
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - label: Highlights
                name: highlights
                widget: list
                summary: '{{fields.title}}'
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: body, widget: text }
                  - { label: Link (e.g. /menu/abak-atama), name: link, widget: string, required: false }
          - label: What makes us different
            name: different
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: body, widget: text }
          - label: Photo gallery
            name: gallery
            widget: list
            fields:
              - { label: Photo, name: src, widget: image }
              - { label: Description, name: alt, widget: string }
      - name: careers
        label: Careers
        file: content/careers.json
        format: json
        fields:
          - { label: Intro, name: intro, widget: text }
          - { label: Application email, name: applyEmail, widget: string }
          - { label: Application WhatsApp (digits, with 234), name: applyWhatsapp, widget: string }
          - { label: WhatsApp number as shown, name: applyWhatsappDisplay, widget: string }
          - { label: How to apply, name: howToApply, widget: text }
          - { label: General requirements, name: generalRequirements, widget: list, required: false, field: { label: Requirement, name: item, widget: string } }
          - { label: Closing note, name: openToAll, widget: text }
          - label: Open positions
            name: positions
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Job title, name: title, widget: string }
              - { label: Location, name: location, widget: string, default: Uyo }
              - { label: Type (e.g. Full-time), name: type, widget: string, required: false }
              - { label: Note (e.g. Female applicants), name: note, widget: string, required: false }
              - { label: Open, name: open, widget: boolean, default: true, hint: 'On = shows as Open with apply buttons. Off = shows as Closed. Delete the role to remove it completely.' }
              - { label: Description paragraphs, name: summary, widget: list, required: false, field: { label: Paragraph, name: text, widget: text } }
              - { label: Requirements, name: requirements, widget: list, required: false, field: { label: Requirement, name: item, widget: string } }
              - { label: Work schedule, name: schedule, widget: string, required: false }
              - { label: Job description link (Google Doc), name: jdLink, widget: string, required: false }

  # ── Restaurant settings ───────────────────────────────────
  - name: settings
    label: Restaurant settings
    description: Opening hours, WhatsApp, email, address, social links and the first-order discount.
    files:
      - name: settings
        label: Restaurant settings
        file: content/settings.json
        format: json
        fields:
          - label: WhatsApp number for orders
            name: whatsapp
            widget: string
            pattern: ['^[0-9]{10,15}$', 'Digits only, starting with the country code, e.g. 2349034013321']
            hint: Digits only, with country code and no +, e.g. 2349034013321
          - label: WhatsApp number as shown on the site
            name: whatsappDisplay
            widget: string
            hint: e.g. +234 903 401 3321
          - { label: Tagline, name: tagline, widget: string, default: Where Taste Meets Tradition }
          - { label: Short intro (home page), name: intro, widget: text }
          - { label: City, name: city, widget: string, default: Uyo }
          - { label: Address, name: address, widget: text, hint: Shown in the footer, on the About page and for pickup orders. }
          - { label: Email, name: email, widget: string, required: false }
          - label: Social media links
            name: socials
            widget: object
            fields:
              - { label: Instagram link, name: instagram, widget: string, required: false }
              - { label: TikTok link, name: tiktok, widget: string, required: false }
              - { label: Facebook link, name: facebook, widget: string, required: false }
          - label: First-order discount
            name: promo
            widget: object
            fields:
              - { label: Show the offer, name: enabled, widget: boolean, default: true }
              - { label: Code, name: code, widget: string, hint: 'Customers type this at checkout, e.g. GOURMET' }
              - { label: Discount (%), name: percent, widget: number, value_type: int, min: 1, max: 100 }
              - { label: Banner text, name: banner, widget: string, hint: The code is added after this text automatically. }
          - label: Opening hours (Nigeria time)
            name: hours
            widget: object
            hint: 24-hour clock. 9 = 9am, 13 = 1pm, 21 = 9pm. Visitors see “We’re closed” outside these hours and can still pre-order.
            fields:
              - label: Monday
                name: monday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Tuesday
                name: tuesday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Wednesday
                name: wednesday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Thursday
                name: thursday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Friday
                name: friday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Saturday
                name: saturday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
              - label: Sunday
                name: sunday
                widget: object
                collapsed: true
                summary: "{{fields.open}}:00 – {{fields.close}}:00"
                fields:
                  - { label: Closed all day, name: closed, widget: boolean, default: false, required: false }
                  - { label: Opens at (0–23), name: open, widget: number, value_type: int, min: 0, max: 23 }
                  - { label: Closes at (1–24), name: close, widget: number, value_type: int, min: 1, max: 24 }
